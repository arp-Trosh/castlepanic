[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "castlepanic"
version = "0.1.0"
description = "Castle Panic in the terminal, in 3D (unicode3d)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "unicode3d"]

[project.scripts]
castlepanic = "castlepanic.__main__:main"

[tool.setuptools.packages.find]
include = ["castlepanic*"]

[tool.setuptools.package-data]
castlepanic = ["data/models/*.glb"]
